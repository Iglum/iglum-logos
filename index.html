<!doctype html>
<html lang="en" data-theme="iglum">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iglum Logos</title>
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#1A0E2E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* Themes: bg = page, bar = tab/status bars, line = borders, accent = session badge,
       accent-2 = prompt + mode badge, on-accent = text on the session badge,
       fg = text, active tab and logo, muted = secondary text */
    :root, [data-theme="iglum"] {
      --bg: #1A0E2E; --bar: #241440; --line: #3B1C6B;
      --accent: #7A4FC2; --accent-2: #B9A2E6;
      --fg: #EFE9F7; --muted: #8E80A8;
      --on-accent: var(--bg);               /* default: dark text on the badge */
    }
    [data-theme="iglum"] { --on-accent: #EFE9F7; }   /* amethyst badge needs light text */
    [data-theme="ubuntu"] {
      --bg: #300A24; --bar: #2C001E; --line: #5E2750;
      --accent: #E95420; --accent-2: #F29A76;
      --fg: #FFFFFF; --muted: #AEA79F;
    }
    [data-theme="dracula"] {
      --bg: #282A36; --bar: #21222C; --line: #44475A;
      --accent: #BD93F9; --accent-2: #FF79C6;
      --fg: #F8F8F2; --muted: #8A95C9;
    }
    [data-theme="nord"] {
      --bg: #2E3440; --bar: #3B4252; --line: #434C5E;
      --accent: #88C0D0; --accent-2: #81A1C1;
      --fg: #ECEFF4; --muted: #B4BCCC;
    }
    [data-theme="gruvbox"] {
      --bg: #282828; --bar: #1D2021; --line: #504945;
      --accent: #FABD2F; --accent-2: #B8BB26;
      --fg: #EBDBB2; --muted: #A89984;
    }
    [data-theme="catppuccin"] {
      --bg: #1E1E2E; --bar: #181825; --line: #313244;
      --accent: #CBA6F7; --accent-2: #89B4FA;
      --fg: #CDD6F4; --muted: #9399B2;
    }
    [data-theme="solarized"] {
      --bg: #002B36; --bar: #073642; --line: #0E4B5A;
      --accent: #B58900; --accent-2: #2AA198;
      --fg: #EEE8D5; --muted: #93A1A1;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex; flex-direction: column;
      background: var(--bg);
      color: var(--fg);
      font: 14px/1.5 "JetBrains Mono", ui-monospace, Consolas, monospace;
      transition: background-color .2s, color .2s;
    }

    /* tmux-style tab bar */
    .tabs {
      display: flex; align-items: stretch;
      background: var(--bar);
      border-bottom: 1px solid var(--line);
      user-select: none;
    }
    .session { padding: 6px 12px; background: var(--accent); color: var(--on-accent, var(--bg)); font-weight: 700; }
    .tabs button {
      font: inherit; color: var(--muted);
      background: none; border: 0; cursor: pointer;
      padding: 6px 14px;
    }
    .tabs button:hover { color: var(--fg); }
    .tabs button[aria-selected="true"] { background: var(--fg); color: var(--bg); font-weight: 700; }
    .tabs button:focus-visible { outline: 2px solid var(--accent-2); outline-offset: -2px; }
    .clock { margin-left: auto; padding: 6px 12px; color: var(--muted); }

    /* stage */
    main {
      flex: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 40px; padding: 32px 16px;
      min-height: 0;
    }
    .logo {
      width: min(80vw, 820px); height: min(52vh, 420px);
      display: flex; align-items: center; justify-content: center;
      color: var(--fg);                       /* inlined SVG paints with currentColor */
      transition: color .2s;
    }
    .logo svg { max-width: 100%; max-height: 100%; width: auto; height: auto; display: block; }
    .logo.appear svg { animation: appear .35s ease-out; }
    @keyframes appear { from { opacity: 0; transform: translateY(6px); } }

    .prompt { width: min(80vw, 820px); color: var(--muted); overflow-wrap: anywhere; }
    .prompt .ps1 { color: var(--accent-2); }
    .prompt .cmd { color: var(--fg); }
    .prompt p { margin: 0; }
    .cursor {
      display: inline-block; width: .6em; height: 1.1em; vertical-align: text-bottom;
      background: var(--fg); animation: blink 1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* vim-style status line */
    .status {
      display: flex; gap: 16px;
      padding: 4px 12px;
      background: var(--bar); border-top: 1px solid var(--line);
      color: var(--muted); font-size: 12px;
    }
    .status .mode { color: var(--bg); background: var(--accent-2); padding: 0 8px; font-weight: 700; }
    .status .theme { color: var(--fg); }
    .status .right { margin-left: auto; }

    @media (max-width: 600px) {
      body { font-size: 12px; }
      .tabs button { padding: 6px 10px; }
      .clock, .status .keys { display: none; }
      .logo { width: calc(100vw - 32px); height: 42vh; }
      .prompt { width: calc(100vw - 32px); }
    }
    @media (prefers-reduced-motion: reduce) {
      body, .logo { transition: none; }
      .cursor, .logo.appear svg { animation: none; }
    }
  </style>
</head>
<body>
  <nav class="tabs" role="tablist" aria-label="Logos">
    <span class="session">[iglum]</span>
    <!-- tabs are generated from LOGOS below -->
    <span class="clock" id="clock"></span>
  </nav>

  <main role="tabpanel" id="panel">
    <div class="logo" id="logo" role="img"></div>
    <div class="prompt">
      <p><span class="ps1">iglum@runes:~/logos$</span> <span class="cmd" id="cmd"></span></p>
      <p id="desc"></p>
      <p><span class="ps1">iglum@runes:~/logos$</span> <span class="cursor"></span></p>
    </div>
  </main>

  <footer class="status">
    <span class="mode">NORMAL</span>
    <span id="file"></span>
    <span class="theme" id="theme" aria-live="polite"></span>
    <span class="keys">1–9 switch · ←/→ next · t theme</span>
    <span class="right" id="pos"></span>
  </footer>

  <script>
    const LOGOS = [
      { file: "fi-bindrune-reversed.svg", desc: "# FI bindrune: Fehu (F) and Isa (I) joined into one sign" },
      { file: "ei-bindrune-reversed.svg", desc: "# EI bindrune: an E of three branches, its top branch climbing into Isa" },
      { file: "iglum-lockup-horizontal-reversed.svg", desc: "# Iglum lockup: FI, the runic separator, and the IGLUM wordmark" },
      { file: "iglum-ei-lockup-horizontal-reversed.svg", desc: "# Iglum lockup: EI, the runic separator, and the IGLUM wordmark" },
      { file: "fi-stone-avatar-reversed.svg", desc: "# FI rune stone: the bindrune carved out of a casting stone" },
      { file: "ei-stone-avatar-reversed.svg", desc: "# EI rune stone: the bindrune carved out of a casting stone" },
      { file: "iglum-bindrune-reversed.svg", desc: "# IGLUM bindrune: Isa, Gebo, Laguz, Uruz and Mannaz stacked on one stave" },
      { file: "iglum-bindrune-lockup-horizontal-reversed.svg", desc: "# Iglum lockup: the IGLUM bindrune, the runic separator, and the wordmark" },
      { file: "iglum-bindrune-lockup-stacked-reversed.svg", desc: "# Iglum stacked lockup: the IGLUM bindrune above the wordmark" },
    ];

    // Popular terminal themes; names match the [data-theme] blocks in the CSS
    const THEMES = ["iglum", "ubuntu", "dracula", "nord", "gruvbox", "catppuccin", "solarized"];

    const tabs = document.querySelector(".tabs");
    const clock = document.getElementById("clock");
    const buttons = LOGOS.map((logo, i) => {
      const b = document.createElement("button");
      b.textContent = i + 1;
      b.setAttribute("role", "tab");
      b.setAttribute("aria-controls", "panel");
      b.setAttribute("aria-label", logo.file.replace(/-reversed\.svg$/, ""));
      b.addEventListener("click", () => show(i));
      tabs.insertBefore(b, clock);
      return b;
    });

    const logoBox = document.getElementById("logo");
    const svgCache = {};
    let current = -1;

    // Inline each SVG so it can take the theme's colour (its fill becomes currentColor)
    async function loadSvg(file) {
      if (!svgCache[file]) {
        svgCache[file] = fetch("logos/" + file)
          .then(r => r.text())
          .then(t => t.replace(/fill="#[0-9A-Fa-f]{3,6}"/g, 'fill="currentColor"'));
      }
      return svgCache[file];
    }

    async function show(i) {
      i = (i + LOGOS.length) % LOGOS.length;
      if (i === current) return;
      current = i;
      const { file, desc } = LOGOS[i];
      buttons.forEach((b, j) => {
        b.setAttribute("aria-selected", j === i);
        b.tabIndex = j === i ? 0 : -1;
      });
      document.getElementById("cmd").textContent = "cat " + file;
      document.getElementById("desc").textContent = desc;
      document.getElementById("file").textContent = file;
      document.getElementById("pos").textContent = (i + 1) + "/" + LOGOS.length;
      logoBox.setAttribute("aria-label", desc.replace(/^# /, ""));
      history.replaceState(null, "", "#" + (i + 1));
      const markup = await loadSvg(file);
      if (i !== current) return;                     // a newer tab was chosen while loading
      logoBox.innerHTML = markup;
      const svg = logoBox.querySelector("svg");
      svg.setAttribute("aria-hidden", "true");
      logoBox.classList.remove("appear"); void logoBox.offsetWidth; logoBox.classList.add("appear");
    }

    function setTheme(name) {
      document.documentElement.dataset.theme = name;
      document.getElementById("theme").textContent = "theme: " + name;
      const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
      document.querySelector('meta[name="theme-color"]').setAttribute("content", bg);
      try { localStorage.setItem("theme", name); } catch (e) { /* storage blocked: theme just won't persist */ }
    }

    function cycleTheme(step) {
      const i = THEMES.indexOf(document.documentElement.dataset.theme);
      setTheme(THEMES[(i + step + THEMES.length) % THEMES.length]);
    }

    document.addEventListener("keydown", (e) => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= LOGOS.length) show(n - 1);
      else if (e.key === "ArrowRight" || e.key === "l") show(current + 1);
      else if (e.key === "ArrowLeft" || e.key === "h") show(current - 1);
      else if (e.key === "t") cycleTheme(1);
      else if (e.key === "T") cycleTheme(-1);
    });

    function tick() {
      const d = new Date();
      clock.textContent = d.toLocaleDateString("en-GB", { day: "2-digit", month: "short" }) + " " +
        d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
    }
    tick(); setInterval(tick, 10000);

    // ?theme=nord in the URL wins (shareable links), then the viewer's last choice, then the default
    let saved = new URLSearchParams(location.search).get("theme");
    if (!THEMES.includes(saved)) {
      try { saved = localStorage.getItem("theme"); } catch (e) { /* no storage */ }
    }
    setTheme(THEMES.includes(saved) ? saved : "iglum");

    const start = parseInt(location.hash.slice(1), 10);
    show(start >= 1 && start <= LOGOS.length ? start - 1 : 0);
  </script>
</body>
</html>
